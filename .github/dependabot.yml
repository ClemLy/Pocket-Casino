version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Une seule PR pour l outillage de dev : elles montent toujours ensemble.
      outillage-dev:
        dependency-type: development
        patterns:
          - '*'
      runtime:
        dependency-type: production
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
