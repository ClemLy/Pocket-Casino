name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule execution par branche : un nouveau push annule le run precedent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier le formatage
        run: npm run format:check

      - name: Linter
        run: npm run lint

      - name: Verifier les types
        run: npm run typecheck

      - name: Tests unitaires avec couverture
        run: npm run test:coverage

      - name: Publier le rapport de couverture
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Compiler le bundle de production
        run: npm run build

      - name: Publier le bundle
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  screenshots:
    name: Captures d ecran a jour
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Compiler le bundle
        run: npm run build

      - name: Regenerer les captures
        run: npm run screenshots

      # Les captures sont deterministes (seed fixe). Une difference signale un
      # changement visuel non commite, pas un alea de rendu.
      - name: Publier les captures du run
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
